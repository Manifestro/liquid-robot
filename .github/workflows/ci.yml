name: Python checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ./vendor/mlagents-envs
      - run: python -m pip install -e '.[unity,training,dev]'
      - run: python -m ruff check src tests examples
      - run: python -m ruff format --check src tests examples
      - run: python -m pytest
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
